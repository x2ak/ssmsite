kind = "web"
previewPath = "/"
title = "SSM Site"
version = "1.0.0"
id = "artifacts/ssm-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21670

[services.development]
run = "pnpm --filter @workspace/ssm-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ssm-site", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ssm-site", "run", "start" ]

[services.env]
PORT = "21670"
BASE_PATH = "/"
BACKEND_PORT = "5000"
NODE_ENV = "development"

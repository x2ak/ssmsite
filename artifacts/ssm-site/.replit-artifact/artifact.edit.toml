kind = "web"
previewPath = "/"
title = "SSM Site"
version = "1.0.0"
id = "artifacts/ssm-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21670

[services.development]
run = "pnpm --filter @workspace/ssm-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ssm-site", "run", "build" ]
publicDir = "artifacts/ssm-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21670"
BASE_PATH = "/"
BACKEND_PORT = "5000"
NODE_ENV = "development"

[[services]]
name = "api"
paths = [ "/api" ]
localPort = 5000

[services.env]
BACKEND_PORT = "5000"
NODE_ENV = "development"
